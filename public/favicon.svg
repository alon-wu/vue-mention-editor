<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="vue-mention-editor">
  <!-- 站点图标：品牌色圆角方块 + 白色 @（提及场景的最小识别符号） -->
  <defs>
    <linearGradient id="vme-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#vme-bg)" />
  <text
    x="32"
    y="34"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#ffffff"
  >
    @
  </text>
</svg>
