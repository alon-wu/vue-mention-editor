name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次未跑完的任务
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 格式 / 类型 / 测试 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 不指定 bun-version：自动读取 package.json 的 packageManager（bun@1.4.1）
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 格式检查
        run: bun run format:check

      - name: 类型检查
        run: bun run typecheck

      - name: 单元测试
        run: bun run test

      # 与本地 `bun run build` 完全一致（脚本内部含 typecheck）
      - name: 构建库
        run: bun run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
